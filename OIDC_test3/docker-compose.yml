services:
  postgres:
    image: postgres:16-alpine
    container_name: egisz-auth-db
    environment:
      POSTGRES_DB: egisz_auth
      POSTGRES_USER: user
      POSTGRES_PASSWORD: admin
    ports:
      - "54320:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: egisz-auth-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
